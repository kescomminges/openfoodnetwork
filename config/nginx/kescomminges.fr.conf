upstream puma_kescomminges {
    server 127.0.0.1:3000;
}

upstream puma_kescomminges_dev {
    server 127.0.0.1:3001;
}

# =============================================================================
# Redirection HTTP → HTTPS (prod + dev)
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name kescomminges.fr dev.kescomminges.fr;
    return      301 https://$host$request_uri;
}

# =============================================================================
# PROD — kescomminges.fr
# =============================================================================

server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    server_name kescomminges.fr;

    ssl_certificate     /etc/letsencrypt/live/kescomminges.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kescomminges.fr/privkey.pem;

    access_log /var/log/nginx/kescomminges.log;
    error_log  /var/log/nginx/kescomminges.err.log;

    client_max_body_size 1999M;

    root /home/kescomminges/ofn/openfoodnetwork/public/;

    location ^~ /packs/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|txt|xml|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    location /.well-known/acme-challenge {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri/index.html $uri @puma;
    }

    location @puma {
        proxy_pass         http://puma_kescomminges;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_redirect        off;

        # Protection pendant la phase de mise en place
        auth_basic           "Authentification obligatoire";
        auth_basic_user_file /home/pygricola/pygricola/djangricola/.htpasswd;

        add_header X-Frame-Options "SAMEORIGIN";
    }
}

# =============================================================================
# DEV — dev.kescomminges.fr
# =============================================================================

server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    server_name dev.kescomminges.fr;

    # Certificat — à créer avec : certbot --nginx -d dev.kescomminges.fr
    ssl_certificate     /etc/letsencrypt/live/dev.kescomminges.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.kescomminges.fr/privkey.pem;

    access_log /var/log/nginx/kescomminges-dev.log;
    error_log  /var/log/nginx/kescomminges-dev.err.log;

    client_max_body_size 1999M;

    root /home/kescomminges/ofn/openfoodnetwork-dev/public/;

    location ^~ /packs/ {
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        gzip_static on;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(ico|txt|xml|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    location /.well-known/acme-challenge {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri/index.html $uri @puma_dev;
    }

    location @puma_dev {
        proxy_pass         http://puma_kescomminges_dev;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_redirect        off;

        # Site de dev — accès restreint par mot de passe
        auth_basic           "Accès restreint — site de dev";
        auth_basic_user_file /home/pygricola/pygricola/djangricola/.htpasswd;

        add_header X-Frame-Options "SAMEORIGIN";
    }
}
