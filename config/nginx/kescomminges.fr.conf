upstream puma_kescomminges {
    server 127.0.0.1:3000;
}

# Redirection HTTP → HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name kescomminges.fr;
    return      301 https://kescomminges.fr$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    server_name kescomminges.fr;

    ssl_certificate     /etc/letsencrypt/live/kescomminges.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kescomminges.fr/privkey.pem;

    # Logs
    access_log /var/log/nginx/kescomminges.log;
    error_log  /var/log/nginx/kescomminges.err.log;

    # Taille max des uploads (images produits, etc.)
    client_max_body_size 1999M;

    root /home/kescomminges/ofn/openfoodnetwork/public/;

    # ── Assets compilés (packs Webpack) ─────────────────────────────────────
    # Servis directement par nginx avec cache long — jamais transmis à Puma
    location ^~ /packs/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # ── Fichiers statiques dans public/ ─────────────────────────────────────
    # (assets legacy, images par défaut, favicon, robots.txt…)
    location ^~ /assets/ {
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Fichiers à la racine de public/ (favicon, robots.txt, etc.) ─────────
    location ~* \.(ico|txt|xml|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    # ── Let's Encrypt ────────────────────────────────────────────────────────
    location /.well-known/acme-challenge {
        root /var/www/letsencrypt;
    }

    # ── Tout le reste → Puma ─────────────────────────────────────────────────
    location / {
        try_files $uri/index.html $uri @puma;
    }

    location @puma {
        proxy_pass         http://puma_kescomminges;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_redirect        off;

        # Protection pendant la phase de mise en place
        auth_basic           "Authentification obligatoire";
        auth_basic_user_file /home/pygricola/pygricola/djangricola/.htpasswd;

        add_header X-Frame-Options "SAMEORIGIN";
    }
}
