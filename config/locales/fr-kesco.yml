fr:
  # ===== Kescomminges personnalisations =====
  # Ce fichier override uniquement les clés spécifiques à Kescomminges
  # Rails fusionne automatiquement avec fr.yml
  # Avantage : zéro conflits lors des rebases upstream

  devise:
    failure:
      disabled: "Votre compte a été désactivé. Veuillez nous contacter via <a href='/contact'>notre formulaire de contact</a>."

  # Menu footer personnalisé
  menu_6_title: "Conditions d'utilisation"
  menu_6_url: "/conditions-utilisation"
  menu_7_title: "Mentions légales"
  menu_7_url: "/mentions-legales"

  # Section légale — Kescomminges
  legal:
    cgu:
      title: "Conditions Générales d'Utilisation et de Vente"
      nav_label: "CGU"
    mentions_legales:
      title: "Mentions légales"
      nav_label: "Mentions légales"
    cookies_policy:
      header: "Notre usage des Cookies"
      desc_part_1: "Les cookies sont de tout petits fichiers texte qui sont stockés sur votre ordinateur quand vous naviguez sur certains sites web."
      desc_part_2: "Chez Kescomminges nous sommes particulièrement soucieux de votre vie privée. Nous n'utilisons que les cookies strictement nécessaires au fonctionnement du service. Nous ne vendons aucune de vos données et nous n'utilisons aucun cookie publicitaire ou de traçage tiers."
      desc_part_3: "Nous utilisons des cookies principalement pour vous permettre de rester connecté(e) après votre première connexion si vous le souhaitez (et éviter de saisir votre mot de passe à chaque fois!), ou encore pour mémoriser les produits dans votre panier. Si vous naviguez sur le site sans cliquer sur \"Accepter les cookies\", cela vaut consentement à l'utilisation des cookies nécessaires au bon fonctionnement du site kescomminges.fr. Voilà la liste détaillée des cookies que nous utilisons."
      essential_cookies: "Cookies essentiels"
      essential_cookies_desc: "Les cookies suivants sont nécessaires au fonctionnement du site kescomminges.fr."
      essential_cookies_session_desc: "Session : stockée pendant toute la durée de votre visite, à des fins de sécurité. Obligatoire pour le fonctionnement du site."
      essential_cookies_message_dismiss_desc: "Message de consentement aux cookies : stocké pour ne plus vous afficher ce message après l'avoir validé."
      cookie_openstreemap_desc: "Utilisé par le logiciel de cartographie open source et ami Open Street Map (qui permet l'affichage de la carte sur Kescomminges) pour assurer qu'il ne reçoit pas trop de requêtes sur un laps de temps déterminé, et éviter ainsi les risques d'abus de leurs services."
      cookie_stripe_desc: "Utilisé par le terminal de payement en ligne Stripe (proposé aux utilisateurs de Kescomminges) https://stripe.com/fr/cookies-policy/legal. Même si toutes les boutiques n'utilisent pas Stripe, c'est une bonne pratique en matière de sécurité d'appliquer ce cookie sur toutes les pages vues. Stripe construit probablement une image des pages qui ont un quelconque lien avec l'API connectant Kescomminges à leur système de paiement pour détecter les comportements anormaux pouvant suggérer un risque de fraude. Donc ce cookie a un rôle qui va au-delà de la simple fourniture d'un système de paiement. Le supprimer pourrait affecter la sécurité du service. Pour en savoir plus sur la politique de confidentialité de Stripe: https://stripe.com/fr/privacy."
      statistics_cookies: "Cookies d'analyse de navigation"
      statistics_cookies_desc: "Kescomminges utilise Plausible Analytics, un outil d'analyse open source sans cookie, qui ne collecte aucune donnée personnelle identifiable. Aucun cookie d'analyse n'est déposé sur votre terminal."
      statistics_cookies_matomo_desc_html: "Pour analyser les données concernant votre usage de la plateforme, nous utilisons <a href='https://matomo.org/' target='_blank'>Matomo</a>(anciennement Piwik), outil d'analyse open source compatible RGPD et engagé sur le respect de la vie privée des utilisateurs."
      statistics_cookies_matomo_optout: "Vous ne voulez pas que vos données soient analysées par Matomo ? Nous ne collectons aucune donnée personnelle, et Matomo nous aide à améliorer le service que nous vous offrons, mais nous respectons votre choix :-)"
      cookie_matomo_basics_desc: "Cookies déposés par Matomo pour collecter les statistiques de trafic."

  # Emails - remplacer contact@kescomminges.fr par formulaire de contact
  enterprise_mailer:
    welcome:
      email_welcome: "Merci d'avoir rejoint Kescomminges "
      email_admin_html: "Pour gérer votre entreprise, rendez-vous sur l'%{link}. Kescomminges est un point relais direct producteur : l'utilisation de la plateforme est libre et sans commission sur les ventes."

  email_confirmation_notice_unexpected: "Vous recevez ce message car vous vous êtes inscrit sur %{sitename}, ou avez été invité à vous inscrire par l'un de vos contacts. Si vous ne comprenez pas pourquoi vous recevez ce message, contactez-nous via kescomminges.fr/contact."

  email_signup_text: "Si vous organisez / fournissez un circuit court, n'hésitez pas à nous contacter à kescomminges.fr/contact, nous sommes là pour vous accompagner dans la création de votre espace de vente / commande en ligne. Si vous achetez via un circuit court utilisant Kescomminges, connectez-vous avant de passer commande pour que vos informations personnelles soient gardées en mémoire, cela vous évitera de les ressaisir à chaque commande ! "

  email_signup_help_html: "Des retours à nous faire quant à votre utilisation de la plateforme ? <a href='https://kescomminges.fr/contact'>Contactez-nous via notre formulaire</a>."

  # Page de contact — formulaire Kescomminges
  contact_page:
    title: "Nous contacter"
    intro: "Une question, une suggestion, un problème ? Remplissez ce formulaire et nous vous répondrons dans les meilleurs délais."
    success: "Votre message a bien été envoyé. Nous vous répondrons dans les meilleurs délais."
    legal_notice: "Les informations saisies sont utilisées uniquement pour vous répondre, conformément à notre politique de confidentialité."
    errors:
      blank_fields: "Merci de renseigner au moins votre nom, votre email et votre message."
      invalid_email: "L'adresse email saisie n'est pas valide."
    form:
      name: "Nom"
      name_placeholder: "Votre nom et prénom"
      email: "Email"
      email_placeholder: "votre@email.fr"
      subject: "Sujet"
      subject_placeholder: "De quoi souhaitez-vous nous parler ?"
      message: "Message"
      message_placeholder: "Votre message..."
      send: "Envoyer"
      required: "Champ obligatoire"
    mailer:
      default_subject: "Message via le formulaire de contact"
